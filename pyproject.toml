[project]
name = "graphwalk"
version = "0.2.0"
description = "Cheap, confidence-scored question answering over knowledge graphs: each hop is a calibrated classification decision. Library, CLI, and MCP server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Manvir Chakal" }]
keywords = ["knowledge graph", "kgqa", "graph traversal", "mcp", "llm agents", "calibration", "retrieval"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "networkx>=3.4",
    "numpy>=2.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "typesafe-sdk>=0.7.2,<0.8",
]

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.7",
]
llm = [
    "litellm>=1.60",
]
mcp = [
    "mcp>=1.20",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.34",
]
eval = [
    "httpx>=0.28",
    "pyarrow>=17",  # FanOutQA's Wikipedia corpus mirror is an Arrow file
]

[project.urls]
Homepage = "https://github.com/manvirchakal/graphwalk"
Documentation = "https://manvirchakal.github.io/graphwalk/"
Source = "https://github.com/manvirchakal/graphwalk"
Changelog = "https://github.com/manvirchakal/graphwalk/blob/main/CHANGELOG.md"
Issues = "https://github.com/manvirchakal/graphwalk/issues"

[project.scripts]
graphwalk = "graphwalk.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
    "types-networkx>=3.6.1.20260911",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "ASYNC", "PT", "PTH", "TC", "PL", "S", "BLE", "T20", "RET",
]
ignore = [
    "PLR0913", # protocols legitimately take many keyword args
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T201", "ASYNC240"]  # small scripts: print output, read files directly
"tests/**" = ["S101", "S311", "PLR2004", "PLC0415", "ASYNC240"]  # seeded RNGs and blocking fs are fine in tests

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
strict = ["src"]
extraPaths = ["tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--disable-socket", "--allow-unix-socket"]
markers = [
    "live: calls a real external API; skipped unless --run-live is given",
    "neo4j: needs a running Neo4j; skipped unless --run-neo4j is given",
]
