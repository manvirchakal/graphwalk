name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  check:
    name: check (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Every extra, so pyright can resolve the optional backends.
      - name: Install (all extras + dev)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Test (offline)
        run: uv run pytest

  minimal:
    # The core must import and pass its tests without any optional extra.
    name: test (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/graphwalk --help
          /tmp/wheel-env/bin/python -c "import graphwalk"

  container:
    name: build and smoke-test the container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: docker build -t graphwalk:ci .
      - name: Refuses to serve without auth
        run: |
          if docker run --rm graphwalk:ci; then echo "started without auth"; exit 1; fi
      - name: Serves with a bearer token
        run: |
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          docker run -d --name gw -p 8080:8080 \
            -e GRAPHWALK_AUTH=bearer -e GRAPHWALK_AUTH_TOKEN="$TOKEN" graphwalk:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          uv sync --locked --extra mcp
          uv run python scripts/container_smoke.py http://127.0.0.1:8080 "$TOKEN"
          test "$(docker exec gw id -u)" = "10001"
          if docker logs gw 2>&1 | grep -q "$TOKEN"; then echo "token in logs"; exit 1; fi
      - if: always()
        run: docker logs gw || true
